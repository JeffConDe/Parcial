<ion-header>
  <ion-toolbar color="primary">
    <ion-title>DigiDex - FET</ion-title>
  </ion-toolbar>
  <ion-toolbar color="primary">
    <ion-searchbar placeholder="Buscar Digimon..." (ionInput)="buscarDigimon($event)"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="cargarDatos($event)">
    <ion-refresher-content pullingText="Desliza para actualizar..."></ion-refresher-content>
  </ion-refresher>

  <ion-list *ngIf="cargando">
    <ion-item *ngFor="let item of [1,2,3,4,5,6]">
      <ion-thumbnail slot="start">
        <ion-skeleton-text [animated]="true"></ion-skeleton-text>
      </ion-thumbnail>
      <ion-label>
        <h3><ion-skeleton-text [animated]="true" style="width: 60%;"></ion-skeleton-text></h3>
        <p><ion-skeleton-text [animated]="true" style="width: 40%;"></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-list *ngIf="!cargando">
    <ion-item *ngFor="let d of digimonsFiltrados" button (click)="irAlDetalle(d.name)">
      <ion-avatar slot="start">
        <img [src]="d.img" alt="{{ d.name }}" />
      </ion-avatar>
      <ion-label>
        <h2>{{ d.name }}</h2> <p>Nivel: {{ d.level }}</p> </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
