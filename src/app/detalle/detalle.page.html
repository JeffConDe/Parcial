<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>DETALLE</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="detalle-page">
  <div *ngIf="cargando" class="loading-state">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando detalles...</p>
  </div>

  <div *ngIf="!cargando && digimon" class="detalle-shell">
    <div class="detalle-header">
      <div class="detail-number">{{ detailId }}</div>
      <h1>{{ digimon.name }}</h1>
    </div>

    <div class="image-frame">
      <span class="image-guide">Imagen oficial</span>
      <img [src]="digimon.img" alt="{{ digimon.name }}" />
    </div>

    <div class="info-row">
      <div class="info-card">
        <div class="info-title">Level</div>
        <div class="info-value">{{ digimon.level }}</div>
      </div>
      <div class="info-card">
        <div class="info-title">Attribute</div>
        <div class="info-value">{{ attribute }}</div>
      </div>
      <div class="info-card">
        <div class="info-title">Type</div>
        <div class="info-value">{{ type }}</div>
      </div>
    </div>

    <div class="fields-section">
      <div class="fields-title">Fields</div>
      <div class="fields-grid">
        <div class="field-chip">
          <ion-icon name="flash-outline"></ion-icon>
        </div>
        <div class="field-chip">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>
        <div class="field-chip">
          <ion-icon name="sparkles-outline"></ion-icon>
        </div>
      </div>
    </div>
  </div>
</ion-content>
